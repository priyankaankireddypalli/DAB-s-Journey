# This is a Declarative Automation Bundle definition for dabproject.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabproject
  uuid: b755eb07-fa3f-49ee-955c-a4c923454f7f

include:
  - resources/*.yml
  - resources/*/*.yml


# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-efa0e3dd-52fa.cloud.databricks.com/
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    variables:
      catalog: workspace
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-efa0e3dd-52fa.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/priyanka.ankireddypalli@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/priyanka.ankireddypalli@gmail.com/prod/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: priyanka.ankireddypalli@gmail.com
        level: CAN_MANAGE
